apiVersion: v1
data:
  server.conf: |
    {
      "health_checks": {
        "bind_address": "0.0.0.0",
        "bind_port": "8080",
        "listener_enabled": true,
        "live_path": "/live",
        "ready_path": "/ready"
      },
      "plugins": {
        "BundlePublisher": [
          {
            "k8s_configmap": {
              "plugin_data": {
                "clusters": [
                  {
                    "chart-internal": {
                      "configmap_key": "bundle.spiffe",
                      "configmap_name": "spire-bundle",
                      "format": "spiffe",
                      "namespace": "spire-server"
                    }
                  }
                ]
              }
            }
          }
        ],
        "DataStore": [
          {
            "sql": {
              "plugin_data": {
                "connection_string": "dbname=spire user=spire password=${DBPW} host=spire-cluster-spire.c4lcqsecigxp.us-east-1.rds.amazonaws.com port=5432",
                "database_type": "postgres",
                "disable_migration": false,
                "max_idle_conns": 2,
                "max_open_conns": 100
              }
            }
          }
        ],
        "KeyManager": [
          {
            "aws_kms": {
              "plugin_data": {
                "key_identifier_value": "spire-cluster",
                "region": "us-east-1"
              }
            }
          }
        ],
        "NodeAttestor": [
          {
            "k8s_psat": {
              "plugin_data": {
                "clusters": [
                  {
                    "spire-cluster": {
                      "allowed_node_label_keys": [],
                      "allowed_pod_label_keys": [],
                      "audience": [
                        "spire-server"
                      ],
                      "service_account_allow_list": [
                        "spire-server:spire-agent"
                      ]
                    }
                  }
                ]
              }
            }
          }
        ]
      },
      "server": {
        "audit_log_enabled": false,
        "bind_address": "0.0.0.0",
        "bind_port": "8081",
        "ca_key_type": "rsa-2048",
        "ca_subject": [
          {
            "common_name": "example.org",
            "country": [
              "ARPA"
            ],
            "organization": [
              "Example"
            ]
          }
        ],
        "ca_ttl": "24h",
        "data_dir": "/run/spire/data",
        "default_jwt_svid_ttl": "5m",
        "default_x509_svid_ttl": "1h",
        "disable_jwt_svids": false,
        "jwt_issuer": "https://oidc-discovery.spire-rmf.lab",
        "log_format": "text",
        "log_level": "info",
        "ratelimit": {
          "attestation": true,
          "signing": true
        },
        "trust_domain": "spire-rmf.lab"
      }
    }
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: spire
    meta.helm.sh/release-namespace: spire-server
