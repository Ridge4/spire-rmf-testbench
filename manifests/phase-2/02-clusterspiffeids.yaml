# Phase 2: scoped workload identities.
#
# These replace the chart's built-in "default" ClusterSPIFFEID, which ships with
# empty podSelector and namespaceSelector and therefore matches every pod in
# every namespace. That default is disabled in helm/phase-1/spire-values.yaml.
#
# Each identity below is constrained three ways:
#   - namespaceSelector  : only the payments namespace
#   - podSelector        : only pods carrying the matching app label
#   - spiffeIDTemplate   : the ID is derived from namespace + service account
#
# className must match the controller manager's class. The chart defaults it to
# "<release-namespace>-<release-name>", which is "spire-server-spire" for this
# install. Verify with:
#   kubectl -n spire-server get configmap spire-controller-manager -o yaml | grep -i classname
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: payments-api
spec:
  className: spire-server-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  namespaceSelector:
    matchLabels:
      spiffe.io/spiffe-id: "true"
  podSelector:
    matchLabels:
      app: payments-api
  ttl: 1h
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: payments-db-client
spec:
  className: spire-server-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  namespaceSelector:
    matchLabels:
      spiffe.io/spiffe-id: "true"
  podSelector:
    matchLabels:
      app: payments-db-client
  ttl: 1h
