# SPIRE values, Phase 1
#
# Chart:  spiffe/spire 0.30.3   (SPIRE 1.15.3)
# Closes: IA-5 (enforced TTL), SC-12 (KMS-held key material),
#         the SQLite single point of failure, and the air-gapped image pull.
#
# Every image key below was read from the chart's own values files at 0.30.3,
# not guessed. Verify after any chart bump:
#   helm template spire spiffe/spire --version 0.30.3 \
#     --values helm/phase-1/spire-values.yaml \
#     | grep -oE 'image: .*' | sort -u
#
# busybox and cgr.dev/chainguard images still render upstream. They appear only
# under the charts' tests: blocks, so `helm install` never pulls them; only
# `helm test` would. Noted as a limitation in docs/phase-1-images.md.

global:
  spire:
    clusterName: spire-cluster
    trustDomain: spire-rmf.lab           # not example.org this time

  # These hooks exist to autofix common install problems, and they are what left
  # a stuck spire-server-post-install job on the first attempt. Disabling them
  # removes the kubectl hook image from the pull path and makes failures surface
  # directly instead of being papered over, which is what this testbench wants.
  installAndUpgradeHooks:
    enabled: false

# Federation with external OIDC relying parties is out of scope for Phases 1-4.
# Disabling it also removes several images from the mirror set, which keeps the
# supply-chain attestation surface smaller.
spiffe-oidc-discovery-provider:
  enabled: false

spire-server:
  # Pinned so it matches the EKS Pod Identity association in terraform/kms.tf.
  # If these disagree, the server gets no KMS permissions.
  serviceAccount:
    create: true
    name: spire-server

  image:
    registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
    repository: spiffe/spire-server

  # --- AU-2 / AU-3: structured audit logging ---------------------------------
  #
  # Separate from the operational log. SPIRE emits a structured record per API
  # call, including the caller's identity and the outcome, which is a far better
  # audit source than matching keywords in log prose. The Phase 4 metric filters
  # fall back to text matching; once this is on, prefer the audit events.
  auditLogEnabled: true

  # --- IA-5: lifetime restrictions set by configuration ----------------------
  #
  # The chart ships defaultX509SvidTTL: 4h, so the practicum's "~4 hour"
  # evidence was the chart default rather than a configured policy. 1h is
  # visibly not the default, which makes enforcement demonstrable when the
  # rendered config is cited beside an issued SVID.
  caTTL: 24h
  defaultX509SvidTTL: 1h
  defaultJwtSvidTTL: 5m

  # --- SC-12: private key material lives in KMS ------------------------------
  keyManager:
    disk:
      enabled: false                     # the practicum's posture
    memory:
      enabled: false
    awsKMS:
      enabled: true
      region: us-east-1
      # The plugin needs a stable way to recognize its own keys across
      # restarts: either a file in persistent storage, or a static identifier.
      # The value form is used here because it needs no volume, which is what
      # lets persistence.type stay emptyDir. The identifier becomes part of the
      # KMS alias names SPIRE creates, so it must be stable per server cluster.
      keyIdentifierFile:
        enabled: false                   # no key metadata file on disk
      keyIdentifierValue:
        enabled: true
        # Bumped to -v2 after the original keys were orphaned. See the keyPolicy
        # note below: keys created under the plugin's default policy could not be
        # managed by anyone, including the account root, once the creating IAM
        # role was recreated by Terraform. Changing the identifier makes SPIRE
        # create new keys under new alias names rather than colliding with them.
        identifier: spire-cluster-v3

      # Explicit key policy.
      #
      # Without this the plugin writes a default policy that grants only the
      # principal that created the key. Terraform destroy/apply recreates the
      # SPIRE server role, and although the role ARN string is unchanged, it is
      # a different principal internally, so the old policy no longer matches.
      # The result is a CA signing key that nobody can administer, not even the
      # account root, because AWS's usual root escape hatch only exists if the
      # key policy grants it.
      #
      # This policy keeps the account in control of its own keys across rebuilds:
      #   - root keeps full administrative access (recovery path)
      #   - the SPIRE server role gets exactly the operations the plugin needs
      # Both statements grant by ARN, which re-resolves after a role is recreated.
      #
      # kms:PutKeyPolicy must appear in the role's statement. KMS runs a lockout
      # safety check on CreateKey and rejects any policy that would stop the
      # CALLING principal from updating the policy later. The caller here is the
      # SPIRE server role, not root, so root holding kms:* does not satisfy it.
      # Without this the key creation fails with MalformedPolicyDocumentException:
      # "The new key policy will not allow you to update the key policy in the
      # future."
      keyPolicy:
        policy: |
          {
            "Version": "2012-10-17",
            "Id": "spire-server-key-policy",
            "Statement": [
              {
                "Sid": "AllowAccountAdministration",
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::401352756244:root"
                },
                "Action": "kms:*",
                "Resource": "*"
              },
              {
                "Sid": "AllowSpireServerKeyUse",
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::401352756244:role/spire-cluster-spire-server"
                },
                "Action": [
                  "kms:CreateAlias",
                  "kms:UpdateAlias",
                  "kms:PutKeyPolicy",
                  "kms:DeleteAlias",
                  "kms:DescribeKey",
                  "kms:GetPublicKey",
                  "kms:Sign",
                  "kms:ScheduleKeyDeletion",
                  "kms:ListResourceTags",
                  "kms:TagResource"
                ],
                "Resource": "*"
              }
            ]
          }

      # Alias-based discovery is deprecated upstream and lists every key and
      # alias in the account on each start. Tag-based discovery finds only the
      # keys this plugin manages. Requires kms:TagResource and tag:GetResources
      # in the identity policy (see terraform/kms.tf).
      enableTagBasedKeyDiscovery: true
      keyTags:
        Component: spire-server
        Cluster: spire-cluster

  # --- Datastore: external PostgreSQL instead of bundled SQLite -------------
  dataStore:
    sql:
      databaseType: postgres
      databaseName: spire
      host: spire-cluster-spire.c4lcqsecigxp.us-east-1.rds.amazonaws.com
      port: 5432
      username: spire
      password: ""                       # supplied by externalSecret below
      externalSecret:
        enabled: true
        name: spire-datastore            # created with kubectl; see phase-1-notes.md
        key: password
      disableMigration: false

  # --- No stateful volume at all --------------------------------------------
  #
  # With the datastore in RDS and key material in KMS, the server has nothing
  # left to persist. Stronger than the practicum's posture, which patched gp2 in
  # as the default StorageClass and left reclaimPolicy: Delete holding the only
  # copy of the identity database.
  persistence:
    type: emptyDir

  # An external datastore makes replicas possible, which SQLite could not
  # support. Raise this only when capturing availability evidence, and say so.
  replicaCount: 1

  logLevel: info

  controllerManager:
    enabled: true

    # Phase 2: disable the chart's built-in "default" ClusterSPIFFEID.
    #
    # It ships with empty podSelector and namespaceSelector, which means it
    # matches every pod in every namespace and hands each one an identity. That
    # is the opposite of least privilege, and it is the config-level source of
    # the ns/default/sa/default artifact the practicum reported. Scoped
    # replacements live in manifests/phase-2/02-clusterspiffeids.yaml.
    #
    # Disabling it also removes the Helm install race: the chart was applying
    # these resources in the same pass that creates the server, before the
    # validating webhook had any endpoints.
    identities:
      clusterSPIFFEIDs:
        # All three identities the chart ships are disabled. Each one is applied
        # by Helm in the same pass that creates the server, before the
        # validating webhook has endpoints, which is what failed every upgrade
        # until they were turned off.
        #
        # They are also not wanted on their own merits: "default" matches every
        # pod in every namespace, and the other two belong to components this
        # testbench does not run. Phase 2 and 3 supply scoped replacements in
        # manifests/.
        default:
          enabled: false
        oidc-discovery-provider:
          enabled: false
        test-keys:
          enabled: false

    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: spiffe/spire-controller-manager

  tools:
    kubectl:
      image:
        registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
        repository: kubectl
        tag: v1.37.0
    busybox:
      image:
        registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
        repository: library/busybox
        tag: 1.37.0-uclibc

  # Init container that fixes file ownership on upgrades from older chart
  # versions. With persistence.type: emptyDir there is no persistent volume for
  # it to act on, but the chart still schedules it, so it needs a reachable
  # image like everything else.
  chown:
    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: library/busybox
      tag: 1.37.0-uclibc

spire-agent:
  image:
    registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
    repository: spiffe/spire-agent
  logLevel: info
  tools:
    busybox:
      image:
        registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
        repository: library/busybox
        tag: 1.37.0-uclibc
  chown:
    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: library/busybox
      tag: 1.37.0-uclibc

  # Two agent init containers run chainguard/bash. Upstream pins them by digest
  # inside the tag string ("latest@sha256:..."), which cannot survive mirroring:
  # re-pushing to ECR produces a different manifest digest. The tag is therefore
  # overridden with a plain "latest" pointing at the mirrored copy.
  #
  # socketAlternate is the "ensure-alternate-names" init container; fsGroupFix
  # runs when the agent is non-root. Both are overridden because either may run.
  fsGroupFix:
    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: chainguard/bash
      tag: latest
  socketAlternate:
    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: chainguard/bash
      tag: latest

spiffe-csi-driver:
  image:
    registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
    repository: spiffe/spiffe-csi-driver
  nodeDriverRegistrar:
    image:
      registry: 401352756244.dkr.ecr.us-east-1.amazonaws.com
      repository: sig-storage/csi-node-driver-registrar
      tag: v2.15.0
